[project]
name = "finetune"
requires-python = ">= 3.10"
description = "finetune moshi models"
dynamic = ["version"]
readme = "README.md"
dependencies = [
  "fire",
  "simple-parsing",
  "pyyaml",
  "safetensors",
  "tensorboard",
  "tqdm",
  "torch==2.6",
  "triton>=3.2; sys_platform == 'linux'",
  # "git+https://git@github.com/kyutai-labs/moshi.git#egg=moshi&subdirectory=moshi",
  # We could also use [tool.uv.sources] to point to the git repo, but this maintains
  # compatibility with `pip install -e .`
  "moshi @ git+https://github.com/kyutai-labs/moshi.git#subdirectory=moshi",
  "sphn>=0.2.0,<0.3.0",
  "soundfile",
  "auditok==0.2",
  # Only upstream's annotate.py uses these two now; the pipeline annotates with
  # whisperx. Kept so that file stays runnable, and droppable once whisperx has
  # been validated on the instance.
  "whisper_timestamped",
  # Capped below 3.5 on purpose: from there on whisperx requires torch~=2.8,
  # and the trainer pins torch==2.6. 3.4.5 asks for torch>=2.5.1 and resolves
  # against the existing pins without moving torch, torchaudio or pyannote.
  "whisperx>=3.3.3,<3.5",
  "pyannote.audio",
  "feedparser",
  "requests",
  "boto3",
  "huggingface_hub",
  "torchaudio==2.6",
  "submitit",
  "llvmlite>=0.44",
  "numba>=0.61",
]

[project.optional-dependencies]
# We're putting dev dependencies here rather than [dependency-groups.dev] because
# this way non-uv users can still install them with `pip install -e .[dev]`
dev = [
  "flake8",
  "mypy==1.4.0",
  "mypy-extensions==1.0.0",
  "pre-commit",
  "ruff==0.11",
  "pyright",
  "pytest",
]

# Dependencies for the annotation stages, resolved independently of the trainer.
#
# A dependency-group and not an extra, even though `dev` above is an extra on
# purpose: an extra always carries the project's own dependencies with it, and
# torch==2.6 is exactly what this set has to escape. `uv pip compile --group`
# resolves the group on its own, so whisperx is free to bring torch 2.8.
#
# Why it has to escape: torch==2.6 caps whisperx below 3.5, which caps
# ctranslate2 below 4.5 -- and that build cannot run on a current GPU AMI. Its
# wheel asks for an executable stack, which recent kernels refuse, and it links
# cuDNN 8 while torch ships cuDNN 9.
#
# The annotation scripts never import the trainer, only these plus boto3.
#
# Compiled with:
#   uv pip compile --generate-hashes --universal \
#     --group pyproject.toml:annotate -o requirements-annotate.txt
[dependency-groups]
annotate = [
  # Pinned to the stable release: a bare >= picked up a release candidate.
  "whisperx==3.8.6",
  "whisper_timestamped",
  # Held on the 4.x line. whisperx only asks for >=4.48, and the crisper backend
  # drives transformers' own `pipeline`, which is where a major bump would bite.
  "transformers>=4.48,<5",
  "sphn>=0.2.0,<0.3.0",
  "boto3",
  "numpy",
]

[tool.uv]
# The following fixes Pylance/VSCode not seeing the `finetune` package. See
# https://github.com/astral-sh/uv/issues/3898
config-settings = { editable_mode = "compat" }

[tool.setuptools]
packages = ["finetune"]

[tool.black]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
line-length = 88

[tool.isort]
known_third_party = []
line_length = 88

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
follow_imports = "normal"

[tool.ruff]
lint.select = ["E", "F", "W", "C90", "I", "C4", "PT", "RSE", "TID", "TCH", "FLY", "NPY", "RUF", "T10"]
line-length = 88
lint.ignore = ["E501"]
target-version = "py38"
exclude = [".git","__pycache__",".vscode",".mypy_cache"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.pytest.ini_options]
python_classes = [
  "!TestConfig",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::ImportWarning",
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:wandb",
    "ignore::DeprecationWarning:torch.utils.tensorboard",
    "ignore::UserWarning",
]
testpaths = []
addopts = "--ignore=third_party --ignore=tokens"
