data:
  eval_data: data/jsonl/val.jsonl
  shuffle: true
  train_data: data/jsonl/train.jsonl

moshi_paths:
  hf_repo_id: "kyutai/moshiko-pytorch-bf16"

full_finetuning: true
lora:
  enable: false
  rank: 0
  scaling: 0.
  ft_embed: false

first_codebook_weight_multiplier: 100.
text_padding_weight: .5

duration_sec: 100
batch_size: 16
max_steps: 2000
gradient_checkpointing: true
optim:
  lr: 2e-6
  weight_decay: 0.1
  pct_start: 0.05

seed: 0
log_freq: 1
eval_freq: 100
do_eval: true
do_ckpt: true
ckpt_freq: 100

save_adapters: false

run_dir: runs/e4_full_ft_v1
